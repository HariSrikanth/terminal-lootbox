# Split panes using | and -.
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g mouse on
set-option -g allow-rename off

# Clean single-line status bar.
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 5

set -g status-style "bg=#050505,fg=#d8d8d8"
set -g message-style "bg=#7df9ff,fg=#050505,bold"
set -g message-command-style "bg=#ffb86c,fg=#050505,bold"
set -g mode-style "bg=#7df9ff,fg=#050505,bold"

set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#7df9ff"

set -g window-status-separator ""
set -g window-status-style "bg=#050505,fg=#6f6f6f"
set -g window-status-current-style "bg=#111111,fg=#7df9ff,bold"
set -g window-status-format " #[fg=#6f6f6f]#I:#W#{?window_flags, #{window_flags},} "
set -g window-status-current-format " #[bg=#111111,fg=#7df9ff,bold]#I:#W#{?window_zoomed_flag, [zoom],}#{?window_flags, #{window_flags},} "

set -g status-left-length 30
set -g status-right-length 120
set -g status-left " #[fg=#7df9ff,bold]#S #[fg=#3a3a3a]|#[fg=#d8d8d8] tmux "
set -g status-right "#[fg=#6f6f6f]sessions #[fg=#a6e22e]#($HOME/.tmux/status.sh sessions) #[fg=#3a3a3a]| #[fg=#ffb86c]battery #[fg=#d8d8d8]#($HOME/.tmux/status.sh battery) #[fg=#3a3a3a]| #[fg=#ff6b6b]prefix #[fg=#{?client_prefix,#ff6b6b,#d8d8d8}]#{?client_prefix,ON,off} #[fg=#3a3a3a]| #[fg=#d8d8d8]%a %H:%M "
